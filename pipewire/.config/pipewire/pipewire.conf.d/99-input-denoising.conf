# RNNoise noise suppression as a virtual input ("Noise Canceling source").
# Requires: pacman -S noise-suppression-for-voice
# Toggle which mic apps see with the sspaeti.noise-cancel bar widget
# (it flips the default source between the raw RØDE and rnnoise_source).
# `nofail` keeps PipeWire booting if the LADSPA plugin is missing.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Noise Canceling source"
      media.name       = "Noise Canceling source"
      filter.graph = {
        nodes = [
          { type = ladspa
            name = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label = noise_suppressor_stereo
            control = {
              # Low threshold keeps non-voice sounds (keyboard) mostly intact.
              "VAD Threshold (%)" = 20.0
              "VAD Grace Period (ms)" = 300
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name = "capture.rnnoise_source"
        node.passive = true
        audio.rate = 48000
        # RØDE is mono; PipeWire upmixes it to FL/FR here so the filtered
        # source is stereo and recordings play on both ears.
        audio.channels = 2
        audio.position = [ FL FR ]
        # Boot-time target only; the sspaeti.audio panel retargets the capture
        # stream to whichever mic is chosen (pactl move-source-output). If the
        # target is absent, stay unlinked instead of falling back to the
        # default source, which could be this filter's own output.
        target.object = "alsa_input.usb-R__DE_Microphones_R__DE_NT-USB_Mini_20144376-00.mono-fallback"
        node.dont-fallback = true
      }
      playback.props = {
        node.name = "rnnoise_source"
        media.class = Audio/Source
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
