git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
      # pager: hunk pager
  overrideGpg: true
  merging:
    # "M" menu: put non-fast-forward merge (merge commit "Merge branch 'x' into main")
    # as first option; fast-forward still available as second option
    args: "--no-ff"
customCommands:
  - key: "H"
    context: "files"
    command: 'hunk diff -- "{{.SelectedFile.Name}}"'
    description: "Open file in hunk diff viewer"
    output: terminal
