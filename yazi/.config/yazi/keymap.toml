[mgr]
prepend_keymap = [
	{ on = "?", run = 'help', desc = "Help" },
	{ on = "H", run = 'plugin duckdb -1', desc = "Scroll one column to the left" },
	{ on = "L", run = 'plugin duckdb +1', desc = "Scroll one column to the right" },
	# Sort by modified time (descending = newest first)
	{ on = [ ",", "m" ], run = "sort mtime --reverse=yes", desc = "Sort by modified time (newest first)" },
	# Sort by modified time (ascending = oldest first)
	{ on = [ ",", "M" ], run = "sort mtime --reverse=no", desc = "Sort by modified time (oldest first)" },
	# Copy hovered image to clipboard as PNG (works for webp, jpg, etc.)
	{ on = [ "c", "i" ], run = '''shell 'magick %h png:- | wl-copy --type image/png'''', desc = "Copy image to clipboard" },
	# Rotate selected (or hovered) images in place, losslessly (jpegtran for JPEG, EXIF orientation folded in). See scripts/img-rotate.
	# %s = selected files, falls back to hovered (yazi >= 25.x; the old $@/$n are no longer expanded).
	{ on = [ "i", "r" ], run = "shell '~/.config/yazi/scripts/img-rotate right %s' --block", desc = "Rotate image(s) 90° right (lossless)" },
	{ on = [ "i", "l" ], run = "shell '~/.config/yazi/scripts/img-rotate left %s' --block", desc = "Rotate image(s) 90° left (lossless)" },
	# Open a new terminal in the hovered directory (or the current directory if a file is hovered).
	# %h = hovered entry; yazi runs the shell in the current tab's cwd, so $PWD is the fallback.
	{ on = "<C-Enter>", run = '''shell 'd=%h; [ -d "$d" ] || d="$PWD"; setsid uwsm-app -- xdg-terminal-exec --dir="$d" >/dev/null 2>&1 &' --orphan''', desc = "Open terminal here" },
	# Same, but as a tmux split (right) in the current tmux window
	{ on = "<A-Enter>", run = '''shell 'd=%h; [ -d "$d" ] || d="$PWD"; tmux split-window -h -c "$d"' --orphan''', desc = "Open tmux split here" },
  # { on = "sr", run = 'S', desc = "fuzzy search ripgrep" },
]

[help]
prepend_keymap = [
	{ on = "/", run = 'filter', desc = "Filter" },
]

